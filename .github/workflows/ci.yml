name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install
        run: npm ci && npm --prefix web ci

      - name: Unit tests
        run: npm test

      - name: Build the web app
        run: npm --prefix web run build

      - name: Bundle the Worker (catches import and syntax errors)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Audit dependencies
        run: npm audit --audit-level=moderate && npm --prefix web audit --audit-level=moderate

      - name: End-to-end checks against a local Worker
        run: |
          PASSWORD="ci-$(openssl rand -hex 16)"
          printf 'APP_PASSWORD=%s\n' "$PASSWORD" > .dev.vars
          npx wrangler dev --port 8799 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8799/api/config > /dev/null && break; sleep 2; done
          E2E_URL=http://localhost:8799 E2E_PASSWORD="$PASSWORD" node test/e2e.mjs || { cat wrangler-dev.log; exit 1; }
